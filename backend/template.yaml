Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Architectures:
      - arm64

Resources:
  FileStoreS3:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
            - "*"
            AllowedMethods:
            - GET
            - PUT
            AllowedHeaders:
            - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 7
  UserStore:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: user_id
        AttributeType: S
      KeySchema:
      - AttributeName: user_id
        KeyType: HASH
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/api/hello
      Handler: bootstrap
      Runtime: provided.al2023
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /hello
            Method: GET
  CreateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      Policies:
        - S3WritePolicy:
            BucketName: !Ref FileStoreS3
      CodeUri: cmd/api/create
      Handler: bootstrap
      Runtime: provided.al2023
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /create
            Method: POST
      Environment:
        Variables:
          FILESTORES3_BUCKET_NAME: !Ref FileStoreS3
  GetFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref FileStoreS3
      CodeUri: cmd/api/get
      Handler: bootstrap
      Runtime: provided.al2023
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /get/{id}
            Method: GET
      Environment:
        Variables:
          FILESTORES3_BUCKET_NAME: !Ref FileStoreS3

Outputs:
  ApiUrl:
    Description: API URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

